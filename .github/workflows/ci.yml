name: Dictation fixture qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  protocol-tests:
    name: Dictation protocol (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Test dictation protocol and admission
        run: corepack yarn workspace @cafecode/desktop test src/dictation/MacDictationTarget.test.ts
