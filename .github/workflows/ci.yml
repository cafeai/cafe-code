name: CI

on:
  workflow_dispatch:
    inputs:
      windows_ownership_only:
        description: Run isolated Windows ownership and packaged-runtime qualification
        type: boolean
        default: false
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  windows-ownership-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_ownership_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/reliability.yml
    with:
      windows_ownership_only: true

  quality:
    if: ${{ !inputs.windows_ownership_only }}
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          corepack yarn --version

      - name: Cache Yarn and Turbo
        # Native build outputs must never cross Ubuntu release/ABI boundaries.
        # Keep restore prefixes image-specific as well as the exact cache key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libpng-dev libjson-c-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libgbm-dev libdrm-dev libgles2-mesa-dev libpango1.0-dev libglib2.0-dev

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Qualify installed Electron security runtime
        # Execute only the installed runtime's Node mode in an isolated profile.
        # No Cafe window, provider, credentials or GPU participates in this check.
        run: node scripts/qualify-electron-runtime.ts

      - name: Install Ubuntu 26.04 native qualification runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y sway xwayland dbus-daemon
          # Service-runner sessions need not have a logind-created runtime dir.
          # Create only the disposable runner user's missing private directory;
          # existing paths still pass the fixture's owner/type/mode admission.
          qualification_runtime_dir="/run/user/$(id -u)"
          if [[ ! -e "${qualification_runtime_dir}" && ! -L "${qualification_runtime_dir}" ]]; then
            sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" -- "${qualification_runtime_dir}"
          fi

      - name: Audit repository toolchain
        if: runner.os == 'Linux'
        run: corepack yarn audit:repository

      - name: Format
        if: runner.os == 'Linux'
        run: corepack yarn fmt:check

      - name: Lint
        if: runner.os == 'Linux'
        run: corepack yarn lint

      - name: Typecheck
        # A cold server compile exceeds macOS's default ~2 GiB V8 heap.
        # Run one compiler at a time so several 4 GiB heaps cannot compete
        # on a 7 GiB runner. Turbo passes NODE_OPTIONS through strict env mode.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: corepack yarn typecheck --concurrency=1

      - name: Test
        if: runner.os != 'Windows'
        run: corepack yarn test

      - name: Test (Windows bounded workers)
        # Bound both independent workspace runners and their fork pools after
        # an observed startup exit. Keep the full suite and fail on pool errors;
        # the original failure did not prove a resource or transport cause.
        if: runner.os == 'Windows'
        run: corepack yarn test --concurrency=2 -- --maxWorkers=2

      - name: Isolated PDF attachment parser qualification
        # Keep real bounded parser success, malformed-input and page-cap checks
        # on every native host without simultaneous whole-workspace test load.
        # Synthetic PDFs only: no providers, credentials or external tools.
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/FileAttachmentPdfExtraction.e2e.test.ts

      - name: Isolated Effect test cancellation qualification
        # The child runner intentionally times out one synthetic case, then
        # proves scoped finalizers finish before the next case can start.
        # This invokes no provider, profile, credential or detached runtime.
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/EffectVitestCompatibility.e2e.test.ts

      - name: Isolated macOS standalone volume identity qualification
        # Read native disk metadata only for a filesystem-minted temporary
        # directory. No provider, credentials, or user workspace is involved.
        if: runner.os == 'macOS'
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/StandaloneFilesystemIdentity.e2e.test.ts

      - name: Isolated Codex command and fixture qualification
        # Repeat the focused boundary uncached on each native host. Copied Node
        # and synthetic peers only: no installed providers, profiles or auth.
        run: |
          corepack yarn workspace effect-codex-app-server test src/client.test.ts
          corepack yarn workspace @cafeai/cafe-code test src/provider/Layers/CodexProvider.test.ts src/provider/Layers/CodexSessionRuntime.exit.test.ts src/provider/Layers/ProviderRegistry.test.ts src/launcher.test.ts src/sourceControl/AzureDevOpsCli.test.ts
          corepack yarn workspace @cafeai/cafe-code test src/textGeneration/CodexTextGeneration.test.ts

      - name: Isolated Claude process-exit qualification
        # Exercise the public SDK spawn hook with one synthetic Node child.
        # Never launch an installed provider, account profile or paid request.
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/ClaudeQueryProcess.e2e.test.ts

      - name: Isolated Windows editor launcher
        # Synthetic copied Node/CLI fixture: no installed editor, provider,
        # credentials or live user profile participates in this native test.
        if: runner.os == 'Windows'
        env:
          CAFE_CODE_WINDOWS_EDITOR_E2E: "1"
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/WindowsEditorCommand.e2e.test.ts

      - name: Build desktop pipeline
        run: corepack yarn build:desktop

      - name: Ubuntu 26.04 native helper and private pixman qualification
        # Execute the real Linux helper, not a foreign-platform policy mock.
        # The existing opt-in fixture uses a private headless compositor and
        # verifies capture, resize, restrictive permissions and owned-PID exit.
        # It uses no provider, credentials, host application or hardware GPU.
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          CAFE_CODE_VIRTUAL_DESKTOP_E2E: "1"
          DBUS_SESSION_BUS_ADDRESS: ""
        run: |
          timeout 10s apps/server/dist/cafe-desktop-native --version
          corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/VirtualDesktopFallback.e2e.test.ts

      - name: Install browser test runtime
        if: runner.os == 'Linux'
        run: corepack yarn workspace @cafecode/web exec playwright install --with-deps chromium

      - name: Browser tests
        if: runner.os == 'Linux'
        run: corepack yarn workspace @cafecode/web test:browser

      - name: Install focused browser test runtime
        if: runner.os != 'Linux'
        run: corepack yarn workspace @cafecode/web exec playwright install chromium

      - name: Cross-platform Markdown, timeline, menus and file action browser tests
        # These shared parser/preference changes need real browser coverage on
        # the other hosts too. Linux retains its full browser suite above; this
        # focused subset does not claim native file-manager/editor UI success.
        # Menu focus, secondary-pointer and Desk layout ownership also require
        # real browser events on each host, including macOS Control-click,
        # sidebar replacement races and late delete navigation ownership.
        # Composer tab animation and provider controls use the same host matrix.
        # Expanded Markdown tables also qualify fit/zoom and titlebar-safe
        # dialog geometry across the native browser hosts.
        # Scheduling civil inputs and viewer-local zone labels must also use
        # each host's native Intl catalog rather than a foreign default clock.
        # Passive Claude quota coverage uses native Intl labels and the shared
        # settings/sidebar presenter without starting an authenticated provider.
        # Response-limit recovery prepares an editable draft only; qualify its
        # exact owner/content gates and ordinary Send path on the other hosts.
        # Public summaries and inert command inspection retain native local
        # timestamp labels and exact live/replayed timeline admission.
        # Atrium clicks use the real shared child reader; retain exact history
        # and server ownership plus popup-local render failure recovery.
        # Model-picker account rails retain independent native wheel scrolling
        # and exact keyboard/pointer selection at theme/interface-scale bounds.
        if: runner.os != 'Linux'
        run: corepack yarn workspace @cafecode/web test:browser src/components/ChatMarkdown.browser.tsx src/components/MarkdownTableViewerWin.browser.tsx src/components/MermaidBlock.browser.tsx src/components/MermaidPreview.browser.tsx src/components/MermaidRendering.browser.tsx src/components/MermaidSecurity.browser.tsx src/components/chat/ChatComposer.browser.tsx src/components/chat/ProviderModelPicker.browser.tsx src/components/chat/MessagesTimelineRealList.browser.tsx src/components/chat/MessagesTimeline.browser.tsx src/components/chat/ProviderOperationWorkEntry.browser.tsx src/components/chat/ThreadErrorBanner.browser.tsx src/components/ChatView.composer.browser.tsx src/components/chat/ScheduledFollowups.browser.tsx src/components/chat/ScheduledFollowupConversation.browser.tsx src/components/chat/ScheduledFollowupNotices.browser.tsx src/components/settings/SettingsPanels.browser.tsx src/components/ContextMenu.browser.tsx src/components/SidebarChromeHeader.browser.tsx src/components/MacTitlebar.browser.tsx src/components/MacBrowserTitlebar.browser.tsx src/components/desk/DeskWorkspace.browser.tsx src/components/desk/DeskSidebar.browser.tsx src/components/ThreadActions.browser.tsx src/components/ChatView.desk.browser.tsx src/components/ProviderAccountQuotaDetails.browser.tsx src/components/chat/useProviderQuota.browser.tsx src/components/chat/ProviderQuotaSurfaces.browser.tsx src/components/chat/ContextWindowDetails.browser.tsx src/components/chat/SessionRail.browser.tsx src/components/chat/ClaudeTaskControls.browser.tsx src/components/chat/TraitsPicker.serviceTiers.browser.tsx src/components/settings/ProviderInstanceCard.layout.browser.tsx src/components/atrium/TaskAtrium.browser.tsx src/components/atrium/AtriumSubagentDetailBoundary.browser.tsx --maxWorkers=2

      - name: Diagram and table PNG browser qualification
        # Shared image rendering/menu tests retain the same native-host worker
        # bound; Linux already runs them through the complete browser suite.
        if: runner.os != 'Linux'
        run: corepack yarn workspace @cafecode/web test:browser src/components/DiagramImageExport.browser.tsx src/components/MarkdownTableExport.browser.tsx src/components/ImageExportMenu.browser.tsx --maxWorkers=2

      - name: Isolated MCP bridge artifacts
        if: runner.os == 'Linux'
        env:
          CAFE_CODE_MCP_BRIDGE_E2E: "1"
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/CafeMcpBridge.e2e.test.ts

      - name: Final forced desktop verification
        # The earlier bundle supplies the isolated MCP bridge fixture. Rebuild
        # after all platform/browser tests so the final boundary is uncached.
        run: corepack yarn build:desktop --force

  native-artifacts:
    name: Native artifact (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            command: dist:desktop:win:x64
          - name: macos-arm64
            os: macos-15
            command: dist:desktop:dmg:arm64
          - name: macos-x64
            os: macos-15-intel
            command: dist:desktop:dmg:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Cache Yarn and Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libpng-dev libjson-c-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libgbm-dev libdrm-dev libgles2-mesa-dev libpango1.0-dev libglib2.0-dev

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build native artifact
        run: corepack yarn ${{ matrix.command }}

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cafe-code-${{ matrix.name }}
          path: release/
          if-no-files-found: error

  linux-artifact:
    name: Linux AppImage (Ubuntu 26.04 qualification)
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Cache Yarn and Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libpng-dev libjson-c-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libgbm-dev libdrm-dev libgles2-mesa-dev libpango1.0-dev libglib2.0-dev

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build AppImage
        run: corepack yarn dist:desktop:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cafe-code-linux-x64
          path: release/
          if-no-files-found: error
