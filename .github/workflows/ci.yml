name: CI

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ""
      release_candidate:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      reliability_only:
        description: Run the complete isolated reliability and packaged-runtime workflow
        type: boolean
        default: false
      windows_ownership_only:
        description: Run isolated Windows ownership and packaged-runtime qualification
        type: boolean
        default: false
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  reliability-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reliability_only && !inputs.windows_ownership_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/reliability.yml
    with:
      source_ref: ${{ github.sha }}

  windows-ownership-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_ownership_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/reliability.yml
    with:
      windows_ownership_only: true

  node-checks:
    if: ${{ !inputs.windows_ownership_only && !inputs.reliability_only }}
    name: Node checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          corepack yarn --version

      - name: Cache Yarn and Turbo
        # Native build outputs must never cross Ubuntu release/ABI boundaries.
        # Keep restore prefixes image-specific as well as the exact cache key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Isolated Windows managed installer transaction
        # This synthetic native boundary needs dependencies but no desktop
        # build. Fail here before spending time on unrelated qualification.
        if: runner.os == 'Windows'
        env:
          CAFE_CODE_WINDOWS_MANAGED_INSTALLER_E2E: "1"
        run: node scripts/windows-managed-installer-smoke.ts

      - name: Qualify installed Electron security runtime
        # Execute only the installed runtime's Node mode in an isolated profile.
        # No Cafe window, provider, credentials or GPU participates in this check.
        run: node scripts/qualify-electron-runtime.ts

      - name: Audit repository toolchain
        if: runner.os == 'Linux'
        run: corepack yarn audit:repository

      - name: Format
        if: runner.os == 'Linux'
        run: corepack yarn fmt:check

      - name: Lint
        if: runner.os == 'Linux'
        run: corepack yarn lint

      - name: Prepare intended Effect compiler
        # Yarn does not run prepare as an install lifecycle. Keep dependency
        # scripts disabled and invoke only this reviewed patch --force command.
        run: corepack yarn prepare

      - name: Qualify actual Effect compiler diagnostics
        # This fresh API/CLI probe owns sequential 4 GiB/30-second children;
        # a same-version marker or successful plain tsc is not qualification.
        run: corepack yarn exec node scripts/qualify-effect-compiler.ts

      - name: Typecheck
        # A cold server compile exceeds macOS's default ~2 GiB V8 heap.
        # The canonical command caps admission at three workspace compilers.
        # Each 4 GiB heap ceiling excludes native/OS memory; it is not an
        # aggregate memory guarantee. Keep the full graph and this step-only
        # setting. Turbo passes NODE_OPTIONS through strict env mode.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: corepack yarn typecheck

      - name: Node tests
        run: corepack yarn test:ci:node

      - name: Isolated PDF attachment parser qualification
        # Keep real bounded parser success, malformed-input and page-cap checks
        # on every native host without simultaneous whole-workspace test load.
        # Synthetic PDFs only: no providers, credentials or external tools.
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/FileAttachmentPdfExtraction.e2e.test.ts

      - name: Isolated Effect test cancellation qualification
        # The child runner intentionally times out one synthetic case, then
        # proves scoped finalizers finish before the next case can start.
        # This invokes no provider, profile, credential or detached runtime.
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/EffectVitestCompatibility.e2e.test.ts

      - name: Isolated development server file admission
        # Exact synthetic temporary files and real loopback HTTP only. Qualify
        # Vite and multi-project Vitest deny lists without a browser/provider.
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/DevToolFileAccess.e2e.test.ts

      - name: Isolated macOS standalone volume identity qualification
        # Read native disk metadata only for a filesystem-minted temporary
        # directory. No provider, credentials, or user workspace is involved.
        if: runner.os == 'macOS'
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/StandaloneFilesystemIdentity.e2e.test.ts

      - name: Isolated Codex command and fixture qualification
        # Repeat the focused boundary uncached on each native host. Copied Node
        # and synthetic peers only: no installed providers, profiles or auth.
        run: |
          corepack yarn workspace effect-codex-app-server test src/client.test.ts
          corepack yarn workspace @cafeai/cafe-code test src/provider/Layers/CodexProvider.test.ts src/provider/Layers/CodexSessionRuntime.exit.test.ts src/provider/Layers/ProviderRegistry.test.ts src/launcher.test.ts src/sourceControl/AzureDevOpsCli.test.ts
          corepack yarn workspace @cafeai/cafe-code test src/textGeneration/CodexTextGeneration.test.ts

      - name: Isolated Claude process-exit qualification
        # Exercise the public SDK spawn hook with one synthetic Node child.
        # Never launch an installed provider, account profile or paid request.
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/ClaudeQueryProcess.e2e.test.ts

      - name: Isolated Windows editor launcher
        # Synthetic copied Node/CLI fixture: no installed editor, provider,
        # credentials or live user profile participates in this native test.
        if: runner.os == 'Windows'
        env:
          CAFE_CODE_WINDOWS_EDITOR_E2E: "1"
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/WindowsEditorCommand.e2e.test.ts

      - name: Audit all release dependencies
        if: inputs.release_candidate
        run: corepack yarn npm audit --all --recursive --no-deprecations

      - name: Release smoke
        if: inputs.release_candidate && runner.os == 'Linux'
        run: corepack yarn release:smoke

      - name: Retain test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-node-${{ matrix.os }}-${{ github.run_attempt }}
          path: .logs/test-timings/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  browser-checks:
    if: ${{ !inputs.windows_ownership_only && !inputs.reliability_only }}
    name: Browser checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          corepack yarn --version

      - name: Cache Yarn and Turbo
        # Native build outputs must never cross Ubuntu release/ABI boundaries.
        # Keep restore prefixes image-specific as well as the exact cache key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Install browser test runtime
        if: runner.os == 'Linux'
        run: corepack yarn workspace @cafecode/web exec playwright install --with-deps chromium

      - name: Install native browser test runtime
        if: runner.os != 'Linux'
        run: corepack yarn workspace @cafecode/web exec playwright install chromium

      - name: Browser feature checks
        # The same local runner builds fixture artifacts and closes each native
        # provider before the next input/media/security group starts.
        run: corepack yarn test:browser:ci

      - name: Retain synthetic Desk sidebar failure artifacts
        # Preserve only this credential-free fixture's attachments. Other
        # suites can contain unrelated data and are intentionally excluded.
        # The bounded pre-unmount state is retained in the ordinary job log;
        # Vitest's later screenshot may show an already-unmounted fixture.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desk-sidebar-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: apps/web/.vitest/attachments/failure-screenshots/DeskSidebar.browser.tsx/
          # The explicit synthetic-only path sits under the hidden .vitest
          # directory. Never broaden this to a workspace/root hidden-file glob.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain synthetic visualization and Mermaid failure evidence
        # Exact synthetic-only paths, not the whole attachment or temp tree.
        # Diagnostic artifacts never qualify as a native release artifact.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visualization-qualification-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            apps/web/.vitest/attachments/failure-screenshots/MermaidFamilies.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/MermaidFamilies.allocation.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/MermaidFamilies.output.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/MermaidFamilies.parsed.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/MermaidFamilies.probe.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/MermaidSecurity.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/Visualizations.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/VisualizationFluid.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/VisualizationHistory.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/VisualizationOwner.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/InlineMcpAppBridge.browser.tsx/
            apps/web/.vitest/attachments/failure-screenshots/VisualizationInlineCapture.browser.tsx/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-browser-${{ matrix.os }}-${{ github.run_attempt }}
          path: .logs/test-timings/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  quality:
    # Preserve the existing required check as an explicit failure when either
    # test matrix fails; a skipped dependent check can otherwise allow merging.
    if: ${{ always() && !cancelled() && !inputs.windows_ownership_only && !inputs.reliability_only }}
    name: Quality (${{ matrix.os }})
    needs: [node-checks, browser-checks]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Require successful test matrices
        if: ${{ needs['node-checks'].result != 'success' || needs['browser-checks'].result != 'success' }}
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate
          corepack yarn --version

      - name: Cache Yarn and Turbo
        # Native build outputs must never cross Ubuntu release/ABI boundaries.
        # Keep restore prefixes image-specific as well as the exact cache key.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Final forced desktop verification
        # All native Node and browser matrices must pass before this final
        # uncached build. Artifact publication remains downstream of Quality.
        run: corepack yarn build:desktop --force

  native-artifacts:
    name: Native artifact (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            command: dist:desktop:win:x64
          - name: macos-arm64
            os: macos-15
            command: dist:desktop:dmg:arm64
          - name: macos-x64
            os: macos-15-intel
            command: dist:desktop:dmg:x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Cache Yarn and Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build native artifact
        run: corepack yarn ${{ matrix.command }}

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cafe-code-${{ matrix.name }}
          path: release/
          if-no-files-found: error

  linux-artifact:
    name: Linux AppImage (Ubuntu 26.04 qualification)
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Cache Yarn and Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-26.04-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build AppImage
        run: corepack yarn dist:desktop:linux

      - name: Upload AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cafe-code-linux-x64
          path: release/
          if-no-files-found: error
