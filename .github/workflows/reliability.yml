name: Reliability and dependency canaries

# Keep external processes and registry availability outside the deterministic
# PR test graph. This workflow spends no provider tokens and reads no account
# credentials: provider lifecycle cases use isolated synthetic runtimes.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1,4"

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  dependency-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
      - run: corepack enable
      - run: corepack yarn install --immutable
      # Deprecations remain maintenance signals, not known vulnerabilities.
      # No advisory, package, or severity exclusions are permitted here.
      - run: corepack yarn npm audit --all --recursive --no-deprecations

  process-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Isolated daemon restart and pipeline liveness
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/providerDaemonRestart.e2e.test.ts integration/providerPipelineLiveness.e2e.test.ts

  packaged-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            build: dist:desktop:linux
            smoke: test:native-linux-artifact
          - os: macos-15
            build: dist:desktop:dmg:arm64
            smoke: test:native-macos-artifact
          - os: windows-2025
            build: dist:desktop:win:x64
            smoke: test:native-windows-artifact
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CAFE_CODE_DESKTOP_SIGNED: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.1
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn ${{ matrix.build }}
      # Each smoke installs/launches in a test-owned environment, verifies
      # readiness rather than merely absence of errors, and cleans up its PIDs.
      - if: runner.os != 'Linux'
        run: corepack yarn ${{ matrix.smoke }}
      - name: Install Linux display runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libx11-xcb1
      - name: Launch Linux artifact in isolated virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a corepack yarn ${{ matrix.smoke }}
