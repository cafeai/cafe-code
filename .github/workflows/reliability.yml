name: Reliability and dependency canaries

# Keep external processes and registry availability outside the deterministic
# PR test graph. This workflow spends no provider tokens and reads no account
# credentials: provider lifecycle cases use isolated synthetic runtimes.
on:
  workflow_call:
    inputs:
      windows_ownership_only:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      windows_ownership_only:
        description: Qualify Windows ownership and packaged runtime on this ref only
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * 1,4"

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  dependency-advisories:
    if: ${{ !inputs.windows_ownership_only }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack yarn install --immutable
      # Deprecations remain maintenance signals, not known vulnerabilities.
      # No advisory, package, or severity exclusions are permitted here.
      - run: corepack yarn npm audit --all --recursive --no-deprecations

  process-lifecycle:
    if: ${{ !inputs.windows_ownership_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Isolated daemon restart and pipeline liveness
        run: corepack yarn workspace @cafeai/cafe-code exec vitest run --config vitest.e2e.config.ts integration/providerDaemonRestart.e2e.test.ts integration/providerPipelineLiveness.e2e.test.ts

  packaged-runtime:
    strategy:
      fail-fast: false
      matrix:
        # Manual Windows qualification can exercise a review ref without
        # starting unrelated native builds. Scheduled coverage is unchanged.
        include: ${{ fromJSON(inputs.windows_ownership_only && '[{"os":"windows-2025","build":"dist:desktop:win:x64","smoke":"test:native-windows-artifact"}]' || '[{"os":"ubuntu-26.04","build":"dist:desktop:linux","smoke":"test:native-linux-artifact"},{"os":"macos-15","build":"dist:desktop:dmg:arm64","smoke":"test:native-macos-artifact"},{"os":"windows-2025","build":"dist:desktop:win:x64","smoke":"test:native-windows-artifact"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CAFE_CODE_DESKTOP_SIGNED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'dev' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Install Linux native desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwayland-dev wayland-protocols libxkbcommon-dev libpng-dev libjson-c-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libgbm-dev libdrm-dev libgles2-mesa-dev libpango1.0-dev libglib2.0-dev
      - name: Qualify Windows process identity and ownership transactions
        if: runner.os == 'Windows'
        run: node scripts/windows-process-ownership-smoke.ts
      - run: corepack yarn ${{ matrix.build }}
      - name: Record Windows installer identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ownershipInstallers = @(Get-ChildItem -LiteralPath release -File -Filter '*.exe')
          if ($ownershipInstallers.Count -ne 1) {
            throw 'Expected exactly one isolated Windows installer artifact.'
          }
          $ownershipInstaller = $ownershipInstallers[0]
          $ownershipDigest = Get-FileHash -LiteralPath $ownershipInstaller.FullName -Algorithm SHA256
          $ownershipSource = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the checked-out source.' }
          [ordered]@{
            phase = 'windows-installer-identity'
            source = $ownershipSource
            file = $ownershipInstaller.Name
            bytes = $ownershipInstaller.Length
            sha256 = $ownershipDigest.Hash.ToLowerInvariant()
          } | ConvertTo-Json -Compress
      # Each smoke installs/launches in a test-owned environment, verifies
      # readiness rather than merely absence of errors, and cleans up its PIDs.
      - if: runner.os != 'Linux'
        run: corepack yarn ${{ matrix.smoke }}
      - name: Install Linux display runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libx11-xcb1
      - name: Launch Linux artifact in isolated virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a corepack yarn ${{ matrix.smoke }}
