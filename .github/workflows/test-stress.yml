name: Optional rendering and RPC stress qualification
on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 2"
permissions:
  contents: read
concurrency:
  group: test-stress-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack yarn install --immutable
      - name: Install browser on Linux
        if: runner.os == 'Linux'
        run: corepack yarn workspace @cafecode/web exec playwright install --with-deps chromium
      - name: Install browser on macOS and Windows
        if: runner.os != 'Linux'
        run: corepack yarn workspace @cafecode/web exec playwright install chromium
      - name: Pinned RPC registry soak
        run: corepack yarn workspace @cafecode/web test:soak
      - name: Native decorative rendering stress
        run: corepack yarn workspace @cafecode/web test:browser:stress
