name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to qualify (for example v0.2.0)
        type: string
        required: true
      publish_release:
        description: Create the tag and publish only after all release gates pass
        type: boolean
        default: false
      build_only:
        description: Skip normal CI; retain signed builds and artifact checksum validation
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-26.04
    outputs:
      source-sha: ${{ steps.release.outputs.source-sha }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout immutable tag source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG_INPUT}"
          if [[ "${tag}" != v* ]]; then
            echo "Release tags must start with v." >&2
            exit 1
          fi
          version="${tag#v}"
          if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel="latest"
            prerelease="false"
          elif [[ "${version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8})\.([1-9][0-9]*)$ ]]; then
            channel="nightly"
            prerelease="true"
          else
            echo "Unsupported release tag: ${tag}" >&2
            echo "Expected vX.Y.Z or vX.Y.Z-nightly.YYYYMMDD.N where N is at least 1." >&2
            exit 1
          fi
          {
            echo "source-sha=$(git rev-parse HEAD)"
            echo "channel=${channel}"
            echo "prerelease=${prerelease}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Release quality
    if: ${{ !inputs.build_only }}
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source-sha }}

  artifacts:
    name: Build ${{ matrix.name }}
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            command: dist:desktop:win:x64
          - name: macos-arm64
            os: macos-15
            command: dist:desktop:dmg:arm64
          - name: macos-x64
            os: macos-15-intel
            command: dist:desktop:dmg:x64
          - name: linux-x64
            # The shipped native helper links host libraries. Keep its oldest
            # qualified ABI baseline while CI qualifies Ubuntu 26.04 separately.
            os: ubuntu-24.04
            command: dist:desktop:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CAFE_CODE_DESKTOP_SIGNED: "false"
      CAFE_CODE_DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Cache Yarn and Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry
            .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-release-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('turbo.json') }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build unsigned Windows or Linux artifact
        if: runner.os != 'macOS'
        run: corepack yarn ${{ matrix.command }}

      - name: Build signed and notarized macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        env:
          CAFE_CODE_DESKTOP_SIGNED: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for required in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required macOS signing secret: ${required}" >&2
              exit 1
            fi
          done
          corepack yarn ${{ matrix.command }}

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(release/*.zip)
          if [[ "${#archives[@]}" != 1 ]]; then
            echo "Expected exactly one signed macOS ZIP." >&2
            exit 1
          fi
          signature_root="$(mktemp -d "${RUNNER_TEMP}/cafe-signature.XXXXXX")"
          trap 'rm -rf "${signature_root}"' EXIT
          ditto -x -k "${archives[0]}" "${signature_root}"
          apps=("${signature_root}"/*.app)
          if [[ "${#apps[@]}" != 1 ]]; then
            echo "Expected exactly one signed macOS app." >&2
            exit 1
          fi
          codesign --verify --deep --strict "${apps[0]}"
          spctl --assess --type execute "${apps[0]}"
          xcrun stapler validate "${apps[0]}"

      - name: Seal qualified artifact identities
        run: node scripts/release-artifact-evidence.ts --write release --sha "${{ needs.prepare.outputs.source-sha }}" --target "${{ matrix.name }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cafe-code-release-${{ matrix.name }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish qualified release
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.artifacts.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.publish_release) && (inputs.build_only || needs.quality.result == 'success') }}
    needs: [prepare, quality, artifacts]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CREATE_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source-sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.17.1 --activate

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cafe-code-release-*
          path: release-assets

      - name: Verify qualified artifact identities
        run: node scripts/release-artifact-evidence.ts --verify release-assets --sha "${{ needs.prepare.outputs.source-sha }}"

      - name: Assemble update feeds
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-publish

          for file in release-assets/cafe-code-release-windows-x64/*; do
            case "${file}" in
              *.exe|*.blockmap|*/${RELEASE_CHANNEL}.yml) cp "${file}" release-publish/ ;;
            esac
          done
          for file in release-assets/cafe-code-release-linux-x64/*; do
            case "${file}" in
              *.AppImage|*.blockmap|*/${RELEASE_CHANNEL}-linux.yml) cp "${file}" release-publish/ ;;
            esac
          done
          for arch in arm64 x64; do
            for file in release-assets/cafe-code-release-macos-${arch}/*; do
              case "${file}" in
                *.dmg|*.zip|*.blockmap) cp "${file}" release-publish/ ;;
              esac
            done
          done

          node scripts/merge-update-manifests.ts \
            --platform mac \
            "release-assets/cafe-code-release-macos-arm64/${RELEASE_CHANNEL}-mac.yml" \
            "release-assets/cafe-code-release-macos-x64/${RELEASE_CHANNEL}-mac.yml" \
            "release-publish/${RELEASE_CHANNEL}-mac.yml"

      - name: Validate release manifests and checksums
        run: >-
          corepack yarn validate:desktop-release
          --release-dir release-publish
          --version "${RELEASE_VERSION}"
          --channel "${RELEASE_CHANNEL}"

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          # Manual branch releases mint the tag after artifact validation.
          # Normal releases require normal CI plus signed artifact validation.
          # Never force an existing tag; GITHUB_TOKEN avoids a second tag run.
          if [[ "${CREATE_RELEASE_TAG}" == "true" ]]; then
            git push origin "${RELEASE_SOURCE_SHA}:refs/tags/${RELEASE_TAG}"
          fi
          remote_sha=""
          while read -r candidate_sha candidate_ref; do
            if [[ "${candidate_ref}" == "refs/tags/${RELEASE_TAG}^{}" ]]; then
              remote_sha="${candidate_sha}"
              break
            fi
            if [[ "${candidate_ref}" == "refs/tags/${RELEASE_TAG}" ]]; then
              remote_sha="${candidate_sha}"
            fi
          done < <(git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")
          if [[ "${remote_sha}" != "${RELEASE_SOURCE_SHA}" ]]; then
            echo "Release tag no longer identifies the qualified commit." >&2
            exit 1
          fi
          args=(
            "${RELEASE_TAG}"
            release-publish/*
            --verify-tag
            --target "${RELEASE_SOURCE_SHA}"
            --title "Cafe Code ${RELEASE_VERSION}"
            --notes "macOS arm64/x64 apps are Developer ID signed and notarized, with DMG and ZIP downloads. Windows x64 uses an unsigned NSIS installer; Linux x64 uses AppImage. Verify manual downloads with SHA256SUMS.txt."
          )
          if [[ "${{ needs.prepare.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
