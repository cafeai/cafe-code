  ><style>
    @font-face {
      font-family: "DM Sans Variable";
      font-style: normal;
      font-display: block;

      unicode-range:

        U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "DM Sans Variable";
      font-style: normal;
      font-display: block;
      font-weight: 100 1000;
      src: url(__FONT_EXT__) format("woff2-variations");
      unicode-range:
        U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+2020,
        U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      /* Tailwind palette values used by Cafe's tokens */
      --neutral-100: oklch(97% 0 0);
      --neutral-400: oklch(70.8% 0 0);
      --neutral-500: oklch(55.6% 0 0);
      --neutral-600: oklch(43.9% 0 0);
      --neutral-800: oklch(26.9% 0 0);
      --neutral-950: oklch(14.5% 0 0);
      --red-300: oklch(80.8% 0.114 19.571);
      --red-400: oklch(70.4% 0.191 22.216);
      --red-500: oklch(63.7% 0.237 25.331);
      --red-700: oklch(50.5% 0.213 27.518);
      --amber-300: oklch(87.9% 0.169 91.605);
      --amber-400: oklch(82.8% 0.189 84.429);
      --amber-500: oklch(76.9% 0.188 70.08);
      --amber-700: oklch(55.5% 0.163 48.998);
      --emerald-400: oklch(76.5% 0.177 163.223);
      --emerald-500: oklch(69.6% 0.17 162.48);

      --font-sans:
        "DM Sans Variable", "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        sans-serif;
      --font-mono: "SF Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      --text-2xs: 0.6875rem;
      --text-xs: 0.75rem;
      --text-ui: 0.8125rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --radius: 0.625rem;
      --radius-sm: calc(var(--radius) - 4px);
      --radius-md: calc(var(--radius) - 2px);
      --radius-lg: var(--radius);
      --radius-xl: calc(var(--radius) + 4px);
      --radius-2xl: calc(var(--radius) + 8px);
      --duration-fast: 120ms;
      --duration-base: 160ms;
      --duration-slow: 220ms;
      --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
      --ease-in: cubic-bezier(0.4, 0, 1, 1);

      /* light (:root) */
      --background: color-mix(in srgb, var(--neutral-100) 55%, white);
      --foreground: var(--neutral-800);
      --chat-foreground: color-mix(in srgb, var(--foreground) 80%, transparent);
      --card: white;
      --popover: white;
      --raised: var(--popover);
      --sunken: color-mix(in srgb, var(--neutral-100) 80%, white);
      --primary: oklch(0.488 0.217 264);
      --primary-foreground: white;
      --secondary: color-mix(in srgb, black 4%, transparent);
      --muted: color-mix(in srgb, black 4%, transparent);
      --accent: color-mix(in srgb, black 4%, transparent);
      --muted-foreground: color-mix(in srgb, var(--neutral-500) 90%, black);
      --subtle-foreground: color-mix(in srgb, var(--neutral-500) 95%, black);
      --disabled-foreground: var(--neutral-400);
      --destructive: var(--red-500);
      --destructive-foreground: var(--red-700);
      --border: color-mix(in srgb, black 8%, transparent);
      --border-subtle: color-mix(in srgb, black 5%, transparent);
      --border-strong: color-mix(in srgb, black 14%, transparent);
      --input: color-mix(in srgb, black 10%, transparent);
      --ring: var(--primary);
      --sidebar-accent-surface: color-mix(in srgb, black 5%, transparent);
      --cafe-sidebar-accent: #44beda;
      --status-running: var(--primary);
      --status-attention: var(--amber-500);
      --status-attention-foreground: var(--amber-700);
      --status-done: var(--emerald-500);
      --status-error: var(--red-500);
      --status-idle: var(--neutral-400);
      --popup-shadow: 0 10px 15px -3px rgb(0 0 0 / 5%), 0 4px 6px -4px rgb(0 0 0 / 5%);
      --popup-edge: 0 1px rgb(0 0 0 / 4%);

      /* concept-only scenery (outside the product) */
      --wallpaper: radial-gradient(120% 90% at 85% 0%, #dfe5ee 0%, #cfd6e0 45%, #bcc4d0 100%);
      --menubar-bg: rgb(246 246 246 / 72%);
      --menubar-fg: rgb(0 0 0 / 85%);
      --tray-pressed: rgb(0 0 0 / 10%);
    }
    .dark {
      --background: color-mix(in srgb, var(--neutral-950) 95%, white);
      --foreground: var(--neutral-100);
      --card: color-mix(in srgb, var(--background) 98%, white);
      --popover: color-mix(in srgb, var(--background) 95%, white);
      --primary: oklch(0.588 0.217 264);
      --secondary: color-mix(in srgb, white 4%, transparent);
      --muted: color-mix(in srgb, white 4%, transparent);
      --accent: color-mix(in srgb, white 4%, transparent);
      --muted-foreground: color-mix(in srgb, var(--neutral-500) 90%, white);
      --subtle-foreground: var(--neutral-400);
      --disabled-foreground: var(--neutral-600);
      --destructive: color-mix(in srgb, var(--red-500) 90%, white);
      --destructive-foreground: var(--red-400);
      --border: color-mix(in srgb, white 7%, transparent);
      --border-subtle: color-mix(in srgb, white 4%, transparent);
      --border-strong: color-mix(in srgb, white 12%, transparent);
      --input: color-mix(in srgb, white 8%, transparent);
      --sunken: #101011;
      --sidebar-accent-surface: color-mix(in srgb, white 6.5%, transparent);
      --cafe-sidebar-accent: #48cfff;
      --status-attention: var(--amber-400);
      --status-attention-foreground: var(--amber-300);
      --status-done: var(--emerald-400);
      --status-error: var(--red-400);
      --status-idle: var(--neutral-500);
      --popup-edge: 0 -1px rgb(255 255 255 / 6%);
      --wallpaper: radial-gradient(110% 80% at 80% -10%, #2a2e36 0%, #1b1d22 45%, #121316 100%);
      --menubar-bg: rgb(28 28 30 / 70%);
      --menubar-fg: rgb(255 255 255 / 88%);
      --tray-pressed: rgb(255 255 255 / 16%);
    }

    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
    }
    body {
      font-family: var(--font-sans);
      font-size: var(--text-sm);
      color: var(--foreground);
      background: #0b0b0c;
      -webkit-font-smoothing: antialiased;
      font-optical-sizing: auto;
    }
    html:not(.dark) body {
      background: #e9ebee;
    }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 1px;
    }
    [hidden] {
      display: none !important;
    }
    svg.i {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
    svg.i.s35 {
      width: 0.875rem;
      height: 0.875rem;
    }
    svg.i.s3 {
      width: 0.75rem;
      height: 0.75rem;
    }
    .tnum {
      font-variant-numeric: tabular-nums;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .spin {
      animation: spin 1s steps(60, end) infinite;
    }
    @keyframes pulse {
      50% {
        opacity: 0.35;
      }
    }
    .pulse {
      animation: pulse 2s steps(60, end) infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .spin,
      .pulse {
        animation: none;
      }
    }

    .iconbtn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      color: var(--muted-foreground);
      transition:
        background-color var(--duration-fast) var(--ease-out),
        color var(--duration-fast) var(--ease-out);
    }
    .iconbtn:hover {
      background: var(--accent);
      color: var(--foreground);
    } /* ---------------- Computer use popover (menu bar) ----------------
   Mirrors components/ui/popover.tsx: rounded-lg, border, bg-popover,
   shadow-lg/5 and the 1px inner edge highlight. */
    .cu {
      position: absolute;
      top: 36px;
      right: 158px;
      width: 420px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--popover);
      color: var(--foreground);
      box-shadow:
        var(--popup-shadow),
        0 24px 48px rgb(0 0 0 / 28%);
      transform-origin: 85% 0;
      animation: pop-in var(--duration-base) var(--ease-out);
    }
    html:not(.dark) .cu {
      box-shadow:
        0 0 0 0.5px rgb(0 0 0 / 4%),
        0 18px 40px rgb(0 0 0 / 14%);
    }
    .cu::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: calc(var(--radius-lg) - 1px);
      box-shadow: var(--popup-edge);
      pointer-events: none;
    }
    @keyframes pop-in {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .cu {
        animation-name: fade-in;
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }
    }

    .cu-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 14px 10px 16px;
    }
    .cu-head .ttl {
      font-size: var(--text-sm);
      font-weight: 600;
      line-height: 1.3;
    }
    .cu-head .sum {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      color: var(--muted-foreground);
    }
    .cu-head .grow {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .cu-head .iconbtn {
      width: 24px;
      height: 24px;
    }

    .notice {
      margin: 0 12px 8px;
      display: flex;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      line-height: 1.45;
      background: color-mix(in srgb, var(--status-attention) 10%, transparent);
      color: var(--status-attention-foreground);
    }
    .notice svg {
      margin-top: 1px;
    }
    .notice b {
      font-weight: 500;
    }

    .roster {
      max-height: 404px;
      overflow-y: auto;
      border-top: 1px solid var(--border-subtle);
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }
    .item {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 10px 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      transition:
        background-color var(--duration-fast) var(--ease-out),
        opacity var(--duration-fast) var(--ease-in);
    }
    .item:last-child {
      border-bottom: 0;
    }
    .item:hover {
      background: var(--accent);
    }
    .item.leaving {
      opacity: 0;
    }
    .item .body {
      min-width: 0;
      padding-top: 1px;
    }
    .item[data-preview="false"] {
      grid-template-columns: 40px 1fr auto;
    }
    .item[data-preview="false"] .shot {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      color: var(--muted-foreground);
    }
    .item .wname {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-ui);
      font-weight: 500;
      line-height: 1.25rem;
    }
    .item .wname .t {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item .wname .sep {
      color: var(--subtle-foreground);
      font-weight: 400;
    }
    .item .chatline {
      font-size: var(--text-xs);
      color: var(--muted-foreground);
      line-height: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item .chatline .prov {
      color: var(--subtle-foreground);
    }
    .state {
      margin-top: 6px;
      max-width: 100%;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 20px;
      padding: 0 7px 0 6px;
      border-radius: var(--radius-sm);
      font-size: var(--text-xs);
      font-weight: 500;
    }
    .state[data-s="capturing"] {
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      color: color-mix(in srgb, var(--primary) 75%, var(--foreground));
    }
    .state[data-s="text"] {
      background: color-mix(in srgb, var(--primary) 8%, transparent);
      color: color-mix(in srgb, var(--primary) 60%, var(--foreground));
    }
    .state[data-s="ready"] {
      background: var(--muted);
      color: var(--muted-foreground);
    }
    .state[data-s="stopping"] {
      background: var(--muted);
      color: var(--muted-foreground);
    }
    .state[data-s="unknown"] {
      background: color-mix(in srgb, var(--status-attention) 12%, transparent);
      color: var(--status-attention-foreground);
    }
    .state[data-s="pending"] {
      background: color-mix(in srgb, var(--status-attention) 12%, transparent);
      color: var(--status-attention-foreground);
    }
    .state .pd {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: currentColor;
    }
    .item .acts {
      display: flex;
      gap: 2px;
    }
    .item .iconbtn {
      width: 26px;
      height: 26px;
    }
    .item .iconbtn.danger:hover {
      background: color-mix(in srgb, var(--destructive) 12%, transparent);
      color: var(--destructive-foreground);
    }

    /* Last actual screenshot: reserved 16:10 box, timestamp chip on the image */
    .shot {
      position: relative;
      width: 88px;
      height: 55px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--muted);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .shot .when {
      position: absolute;
      left: 4px;
      bottom: 4px;
      height: 16px;
      padding: 0 5px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      background: rgb(0 0 0 / 62%);
      color: white;
      backdrop-filter: blur(6px);
    }
    .shot.stale .mini {
      filter: saturate(0.3);
      opacity: 0.55;
    }
    .shot .none {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: var(--text-2xs);
      color: var(--subtle-foreground);
      padding: 6px;
    }
    .mini {
      position: absolute;
      inset: 0;
      transform-origin: 0 0;
    }
    .empty {
      padding: 30px 24px 26px;
      text-align: center;
      border-top: 1px solid var(--border-subtle);
    }
    .empty .ic {
      width: 36px;
      height: 36px;
      margin: 0 auto 10px;
      border-radius: 99px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--muted);
      color: var(--muted-foreground);
    }
    .empty .h {
      font-size: var(--text-sm);
      font-weight: 500;
    }
    .empty .d {
      margin-top: 3px;
      font-size: var(--text-xs);
      color: var(--muted-foreground);
    }

    /* Pinned footer: never inside the scrolling roster */
    .cu-foot {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--border);
      background: var(--popover);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    .btn-stop {
      width: 100%;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--destructive);
      background: var(--destructive);
      color: white;
      font-weight: 500;
      font-size: var(--text-sm);
      box-shadow:
        inset 0 1px rgb(255 255 255 / 16%),
        0 1px 2px color-mix(in srgb, var(--destructive) 24%, transparent);
      transition: background-color var(--duration-fast) var(--ease-out);
    }
    .btn-stop:hover {
      background: color-mix(in srgb, var(--destructive) 90%, black);
    }
    .btn-stop:active {
      transform: scale(0.98);
    }
    .btn-stop:disabled {
      cursor: default;
      opacity: 0.5;
      transform: none;
    }
    .btn-stop.quiet {
      background: var(--muted);
      border-color: var(--border);
      color: var(--muted-foreground);
      box-shadow: none;
      opacity: 1;
    }
    .btn-stop .sq {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: currentColor;
    }

    /* tooltip (InfoTip) */
    .tip {
      position: absolute;
      z-index: 50;
      top: 40px;
      right: 10px;
      width: 260px;
      padding: 6px 8px;
      border-radius: var(--radius-md);
      font-size: var(--text-xs);
      line-height: 1.4;
      background: var(--popover);
      color: var(--foreground);
      border: 1px solid var(--border);
      box-shadow:
        var(--popup-shadow),
        0 8px 20px rgb(0 0 0 / 20%);
    }

    html,
    body {
      background: transparent !important;
      overflow: hidden;
    }
    .cu {
      position: relative;
      top: 0;
      right: 0;
      box-shadow: none !important;
      animation: none;
    }
    .shot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .iconbtn:disabled {
      opacity: 0.4;
      cursor: default;
    }
  </style>
