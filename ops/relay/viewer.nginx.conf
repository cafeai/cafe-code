# Trusted UK static origin. Relay workers have neither write permission nor
# this service's UID/group. The OS administrator of this origin is trusted.
pid /var/lib/cafecode-relay-viewer/nginx.pid;
error_log stderr warn;
worker_processes 1;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    map $status $viewer_cache_control { default no-cache; 404 no-store; }
    server_tokens off;
    client_header_timeout 5s;
    client_body_timeout 5s;
    client_max_body_size 1k;
    large_client_header_buffers 2 8k;
    keepalive_timeout 5s;
    keepalive_requests 16;
    send_timeout 15s;
    sendfile on;
    client_body_temp_path /var/lib/cafecode-relay-viewer/body;
    proxy_temp_path /var/lib/cafecode-relay-viewer/proxy;
    fastcgi_temp_path /var/lib/cafecode-relay-viewer/fastcgi;
    uwsgi_temp_path /var/lib/cafecode-relay-viewer/uwsgi;
    scgi_temp_path /var/lib/cafecode-relay-viewer/scgi;
    server {
        listen 19443 ssl;
        listen [::]:19443 ssl;
        server_name vps-692e150f.vps.ovh.net;
        ssl_certificate /etc/cafecode-relay-viewer/tls.crt;
        ssl_certificate_key /etc/cafecode-relay-viewer/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /opt/cafecode-relay-viewer/current;
        disable_symlinks on from=/opt/cafecode-relay-viewer/current;
        index index.html;
        absolute_redirect off;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control $viewer_cache_control always;
        location = / { return 302 /relay/connect; }
        location ^~ /assets/ { try_files $uri =404; }
        location ^~ /api/ { return 404; }
        location ^~ /attachments/ { return 404; }
        location ~ /\. { return 404; }
        location / {
            limit_except GET { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
